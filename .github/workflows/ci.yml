# The checks every pull request and every push to main must pass (ADR-0009):
# the syntax and help checks, then every simulator in sim/.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never a run on main

jobs:
  sims:
    name: sims
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true          # vendor/etlua (mod/ is update = none, so skipped)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: lupa
        run: pip install lupa==2.8
      - name: check (syntax, help made from the code, Cobalt's limits, vendored copies)
        run: python sim/run.py --check
      - name: sims
        run: python sim/run.py
