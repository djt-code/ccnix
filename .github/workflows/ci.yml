# The checks every pull request and every push to main must pass (ADR-0009):
# the syntax and help checks, then every simulator in sim/. After a green run
# on main, the release job makes release vX.Y.Z for deploy/version if there
# isn't one yet (D5).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:              # (to retry a release: runs on main's tip)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never a run on main

jobs:
  sims:
    name: sims
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true          # vendor/etlua (mod/ is update = none, so skipped)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: lupa
        run: pip install lupa==2.8
      - name: check (syntax, help made from the code, Cobalt's limits, vendored copies)
        run: python sim/run.py --check
      - name: sims
        run: python sim/run.py

  release:
    name: release
    needs: sims
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write             # the tag and the release; nothing else may write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/version
      - name: release deploy/version unless it's out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d '[:space:]' < deploy/version)
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "ccnix v$v is out already: nothing to do"
            exit 0
          fi
          gh release create "v$v" --target "$GITHUB_SHA" --title "ccnix v$v" --generate-notes

  # ADR-0009 D4, step 1: a ccnix release brings the mod along. ccnix-mod's
  # branch bump/ccnix is rebuilt from its main with ccnix/ at the release's tag
  # and the patch version up, and its pull request merges itself on green.
  # Everything is done with LOCKSTEP_TOKEN: what GITHUB_TOKEN does starts no
  # workflows, so the pull request would get no CI and its merge no release.
  lockstep:
    name: lockstep
    needs: release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: lockstep
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.LOCKSTEP_TOKEN }}
      MOD: djt-code/ccnix-mod
      BRANCH: bump/ccnix
      ROM_PATHS: bin lib turtle pc help deploy     # (ccnix-mod's build.gradle, romPaths)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the history, to compare the mod's ccnix/ with the release
      - name: ccnix-mod follows the release
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "no LOCKSTEP_TOKEN: skipped"; exit 0; fi
          v=$(tr -d '[:space:]' < deploy/version)
          tag=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$v" --jq .sha)
          ptr=$(gh api "repos/$MOD/contents/ccnix?ref=main" --jq .sha)
          open=$(gh pr list -R "$MOD" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          finish() {
            echo "$1"
            if [ -n "$open" ]; then gh pr close "$open" -R "$MOD" --delete-branch --comment "$1"; fi
            exit 0
          }
          git cat-file -e "$ptr^{commit}" || { echo "ccnix-mod's ccnix/ ($ptr) isn't in ccnix's history"; exit 1; }
          if git merge-base --is-ancestor "$tag" "$ptr"; then finish "ccnix-mod already carries ccnix v$v."; fi
          # shellcheck disable=SC2086
          if git diff --quiet "$ptr" "$tag" -- $ROM_PATHS; then finish "ccnix v$v changes none of the ROM's files: nothing for the mod to ship."; fi
          git clone -q --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$MOD.git" "$RUNNER_TEMP/mod"
          cd "$RUNNER_TEMP/mod"
          old=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')
          new=$(echo "$old" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          git switch -q -c "$BRANCH"
          git update-index --cacheinfo "160000,$tag,ccnix"
          sed -i "s/^mod_version=.*/mod_version=$new/" gradle.properties
          git add gradle.properties
          git -c user.name="ccnix lockstep" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "ccnix-mod $new: the ROM at ccnix v$v" -m "Made by ccnix's lockstep job (ADR-0009 D4) for ccnix v$v."
          git push -q --force origin "$BRANCH"
          title="ccnix-mod $new: the ROM at ccnix v$v"
          body="ccnix v$v is out, so the mod follows (ccnix's ADR-0009 D4): \`ccnix/\` moves to the release ($tag) and \`mod_version\` goes from $old to $new. Made by ccnix's lockstep job; it merges itself once \`build\` is green, and the mod's release follows."
          if [ -n "$open" ]; then
            gh pr edit "$open" -R "$MOD" --title "$title" --body "$body"
            n=$open
          else
            n=$(gh pr create -R "$MOD" --base main --head "$BRANCH" --title "$title" --body "$body" --label lockstep | sed 's#.*/##')
          fi
          gh pr merge "$n" -R "$MOD" --auto --merge || gh pr merge "$n" -R "$MOD" --merge
